[package]
name = "chapter-04-transformer"
version = "0.1.0"
edition = "2021"
description = "Runnable Candle transformer layers for Chapter 4: Implementing a GPT model from scratch"

[dependencies]
candle-core = "0.6"
itertools = "0.12"
# Candle 0.6 permits newer transitive releases that require a compiler newer than Rust 1.75.
half = "=2.3.1"
indexmap = "=2.2.6"
proc-macro-crate = "=3.1.0"
rayon-core = "=1.12.1"

[dev-dependencies]
pretty_assertions = "1.4"
